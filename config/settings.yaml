# Categorias monitoradas (IDs do Mercado Livre, site MLB).
# Consulte https://api.mercadolibre.com/sites/MLB/categories para a lista completa.
categories:
  - id: MLB1051
    name: Celulares e Telefones
  - id: MLB1648
    name: Informatica
  - id: MLB1000
    name: Eletronicos, Audio e Video

collector:
  # quantos produtos em alta buscar por categoria antes de filtrar
  highlights_per_category: 20
  # quantos produtos aprovados manter por categoria
  max_products_per_category: 5
  # quantos comentarios positivos extrair por produto
  max_reviews_per_product: 8
  # quantas imagens em alta resolucao baixar por produto
  max_images_per_product: 5

filters:
  min_rating: 4.5
  # a vitrine /ofertas mostra a nota e as unidades vendidas, mas nao o total de avaliacoes;
  # suba este valor apenas quando a coleta voltar a vir da API oficial
  min_reviews: 0
  min_sold_quantity: 500
  # descarta produtos sem imagem em resolucao suficiente para 1080x1920
  min_image_width: 800

scriptgen:
  # openai | anthropic (vazio usa SCRIPT_PROVIDER do .env)
  provider: openai
  model_openai: gpt-4o-mini
  model_anthropic: claude-sonnet-5
  # so vale para a OpenAI: os modelos Claude recusam temperature fora do padrao
  temperature: 0.8
  # ritmo medio de narracao em pt-BR, usado para estimar a duracao do roteiro
  words_per_second: 2.6
  retry_when_too_long: true

tts:
  # vazio usa ELEVENLABS_VOICE_ID do .env
  voice_id:
  model_id: eleven_multilingual_v2
  # 0.0 = mais expressivo e instavel, 1.0 = monotono e previsivel
  stability: 0.45
  similarity_boost: 0.8
  style: 0.0
  use_speaker_boost: true
  output_format: mp3_44100_128
  # silencio entre cenas, usado depois na montagem do video
  pause_between_scenes_seconds: 0.25

publishing:
  # intervalo minimo entre duas publicacoes do mesmo nicho
  min_interval_hours: 24
  # sobrescreve o intervalo por nicho (chave = nome da categoria)
  interval_hours_by_niche:
    Informatica: 12
  # json | sqlite
  backend: sqlite
  queue_path: data/out/publications.sqlite3
  # quantos videos no maximo sao publicados a cada execucao de `mlshorts publish-queue`
  max_per_run: 1
  # true exige clicar em "Aprovar" no dashboard antes de qualquer publicacao
  require_approval: false
  # destinos ativos: dry-run | youtube | tiktok (podem ser combinados)
  platforms:
    - dry-run
  # parametro de rastreio do link de afiliado do Mercado Livre
  affiliate_param: matt_word
  max_hashtags: 8
  default_hashtags:
    - achadinhos
    - mercadolivre
    - ofertas
  hashtags_by_niche:
    Celulares:
      - celular
      - tecnologia
    Informatica:
      - setup
      - notebook
    Eletrodomesticos:
      - casa
      - cozinha
  youtube:
    # 22 = People & Blogs, 26 = Howto & Style
    category_id: "22"
    privacy_status: public
    made_for_kids: false
    # marcacao que joga o video no feed de Shorts
    shorts_tag: "#Shorts"
  tiktok:
    # SELF_ONLY enquanto o app estiver em modo sandbox na TikTok
    privacy_level: SELF_ONLY
    disable_comment: false
    disable_duet: false
    disable_stitch: false
    status_poll_attempts: 10
    status_poll_seconds: 3

video:
  # vertical obrigatorio para Shorts/TikTok/Reels
  width: 1080
  height: 1920
  fps: 30
  max_duration_seconds: 45
  background_color: black
  zoom_per_scene: 0.08
  crf: 20
  preset: medium
  audio_bitrate: 192k
  # legendas dinamicas queimadas no video
  font_name: DejaVu Sans
  font_size: 64
  font_color: "&H00FFFFFF"
  outline_color: "&H00000000"
  outline: 4
  caption_words_per_chunk: 3
  caption_margin_bottom: 420
